  name: Nightly database backup
  slug: nightly-database-backup
  description: Dump the trading database to /backups and prune anything older than 14 days. Missing a
    night is worse than missing the record of it, so this runs even when TaskControl's control plane is
    unreachable and reconciles afterwards.
