name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # PostgreSQL runs on every push. A behaviour that only holds on SQLite is not a
    # behaviour TaskControl has, and portability defects are invisible until this runs —
    # a boolean default of `0` passed SQLite and failed PostgreSQL outright.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskcontrol
          POSTGRES_PASSWORD: taskcontrol
          POSTGRES_DB: taskcontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        env:
          # Deliberately not prefixed TASKCONTROL_ — that namespace belongs to application
          # settings, which reject unknown variables carrying it.
          TC_TEST_POSTGRES_URL: postgresql+psycopg://taskcontrol:taskcontrol@localhost:5432/taskcontrol_test
        run: pytest --cov --cov-report=term-missing

      - name: Fail if PostgreSQL tests were skipped
        env:
          TC_TEST_POSTGRES_URL: postgresql+psycopg://taskcontrol:taskcontrol@localhost:5432/taskcontrol_test
        run: |
          # A silent skip would let a PostgreSQL regression reach a release unnoticed.
          pytest -q -k postgresql --no-header -p no:randomly | tee /tmp/pg.txt
          grep -qE "[0-9]+ passed" /tmp/pg.txt
          ! grep -qE "[0-9]+ skipped" /tmp/pg.txt

  install-from-wheel:
    name: console script resolves from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Validates ADR 0019: composition roots must be importable from an installed
      # distribution, not only from a source checkout.
      - name: Build and install the wheel outside the source tree
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          mkdir -p /tmp/isolated && cd /tmp/isolated
          python -m venv .venv
          .venv/bin/pip install "$(echo "$GITHUB_WORKSPACE"/dist/*.whl)[api]"
          .venv/bin/taskctl version
          .venv/bin/python -c "from taskcontrol.apps.api.main import create_app; print('factory ok')"
